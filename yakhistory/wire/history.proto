// Read-only wire subset of yaklang/yaklang common/yakgrpc/yakgrpc.proto
// (AGPL-3.0, 1.4.9-beta8). Field numbers match the upstream engine.
syntax = "proto3";
package ypb;
option go_package = "github.com/zhongxinxuhk/vexnar/yakhistory/wire";

message GetCurrentProjectExRequest { string type = 1; }
message ProjectDescription { int64 id = 3; }
message Paging {
  int64 page = 51;
  int64 limit = 52;
  string order_by = 53;
  string order = 54;
}
message QueryHTTPFlowRequest {
  Paging pagination = 1;
  string source_type = 2;
  string methods = 3;
  string search_url = 4;
  string status_code = 5;
  string search_content_type = 9;
  string keyword = 14;
  bool only_websocket = 15;
  repeated string tags = 23;
}
message QueryHTTPFlowResponse {
  repeated HTTPFlow data = 2;
  int64 total = 3;
}
message GetHTTPFlowByIdRequest { int64 id = 1; }
message HTTPFlow {
  string url = 3;
  bytes request = 5;
  bytes response = 7;
  string source_type = 8;
  string method = 10;
  int64 body_length = 11;
  string content_type = 12;
  int64 status_code = 13;
  int64 created_at = 17;
  string ip_address = 25;
  string title = 26;
  string tags = 27;
  uint64 id = 29;
  bool is_websocket = 30;
}
