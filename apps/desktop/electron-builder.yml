appId: com.vexnar.desktop
productName: VEXNAR
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: src/agent-runtime
    to: agent-runtime
  - from: resources/pg
    to: pg
  - from: resources/vexnar
    to: vexnar
  - from: resources/skills
    to: skills
asar: true
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  icon: build/icon.icns
dmg:
  title: VEXNAR

linux:
  target:
    - AppImage
  category: Development
  icon: build/icon.png
win:
  target:
    - nsis
  icon: build/icon.ico
