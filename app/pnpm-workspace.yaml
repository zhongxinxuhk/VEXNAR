# app/ 的唯一包管理入口：pnpm workspace。
#
# 规则（别再加回第二个包管理器）：
#   - 全 app 只有一个 lockfile：app/pnpm-lock.yaml；
#   - 不许出现 package-lock.json / yarn.lock，也不许在子包里放 pnpm-lock.yaml、
#     pnpm-workspace.yaml —— 子包只声明依赖，安装与锁定都在这里；
#   - 在 app/ 下用 `pnpm install`、`pnpm run <script>`、`pnpm --filter <pkg> run <script>`。
#
# app/dsh/ 是 scripts/fetch-dsh.sh 拉取的 MIT 上游工作树（git-ignored），它自带
# workspace 与 lockfile，故意不在下面的 packages 里。
packages:
  # dsh bundle patch + 两个客户端插件
  - vexnar
  - vexnar/ui
  - vexnar/account
  # dsh 插件包：入口 index.ts → index.js（node_modules 下 Node 不擦类型）
  - vexnar-mcp
  - vexnar-egress
  # TypeScript 核心与存储
  - vexnar-core
  - vexnar-store
  # Web 测试域：会话感知 HTTP 引擎（Policy / Session / Transport / Observer / Evidence）
  - vexnar-web
  # P0 验证 spike
  - spike/*

# 官方运行时安装在 VEXNAR workspace 内，由 pnpm 补全运行时 peer。
autoInstallPeers: true
strictPeerDependencies: false
engineStrict: false

# 运行时原生依赖与客户端 bundle 的构建脚本。
allowBuilds:
  esbuild: true
  electron: true
  '@deepseek-ai/dsh-subprocess-local': true
  koffi: true
  node-pty: true
  '@google/genai': false
  protobufjs: false
