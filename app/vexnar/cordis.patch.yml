# VEXNAR app bundle patch over the dsh web profile.
#
# Layering rule: this file only targets dsh rows by id. VEXNAR's own code is
# app/vexnar/*, so an upstream update never collides with it.

# ── VEXNAR rows ────────────────────────────────────────────────────────────
- insert:
    - id: vexnar-ui
      name: '@vexnar/dsh-ui'
    - id: vexnar-account
      name: '@vexnar/dsh-account'

# ── Model access: TypeScript → NewAPI directly ─────────────────────────────
# The provider route is written at login by @vexnar/dsh-account into the
# llm-pi-ai settings namespace (baseURL + apiKeyEnv + model catalog). Nothing
# here points at the Go gateway; the key lives in dsh's credential store.

# ── Domain tools (transitional) ────────────────────────────────────────────
# Task/finding/traffic tools still live in the Go service while the TS
# migration lands. Remove this row once those tools exist in TypeScript.
- id: mcp-manager
  config:
    servers:
      vexnar:
        transport: streamable-http
        url: http://127.0.0.1:8787/mcp
        headers:
          Authorization: !!js "'Bearer ' + (process.env.VEXNAR_MCP_TOKEN || '')"
        timeoutMs: 60000

# ── Brand: VEXNAR replaces the official artwork ─────────────────────────────
# @vexnar/dsh-ui occupies sidebar.brand.mark / sidebar.brand.name, so the
# official occupant must be off: two occupants of a single slot throw at load.
- id: ui-brand-official
  disabled: true

# ── Account: VEXNAR owns sign-in ────────────────────────────────────────────
# Upstream DeepSeek account rows stay disabled; VEXNAR signs in to NewAPI and
# routes model traffic itself.
- id: deepseek-account
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: ui-settings-account
  disabled: true
- id: ui-account-notifications
  disabled: true

# ── Agent presets: the engine's roles, registered as built-in dsh agents ────
# The Go engine seeds six roles (goals / planner / main / worker / auto /
# pentest). They are copied here as ordinary @deepseek-ai/dsh-agent-preset
# rows, so the roster, the default and every edit live in dsh's own Agent
# management — 设置 → Agent — instead of a parallel VEXNAR panel.
- insert:
    # 目标拆解：只读地把目标拆成可验证子目标。
    - id: preset-vexnar-goals
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vexnar-goals
        name: 目标拆解
        description: 把渗透任务目标拆解成若干独立、可验证的子目标。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 VEXNAR 的目标拆解 agent（role=goals）。把任务目标读清楚，拆成彼此独立、可验证的子目标：
                每个子目标写清验证方式（看到什么算达成）和依赖关系，不臆造目标里没有的范围。
                只做拆解与核对，不执行利用、不改资产、不登记漏洞。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # 规划：读态势、补方向，不直接执行。
    - id: preset-vexnar-planner
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vexnar-planner
        name: 规划
        description: 读取态势、判定目标，只在确有未覆盖的新方向时补充探索意图。
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 VEXNAR 的规划 agent（role=planner）。先读态势：任务目标、已覆盖的目标、资产与已确认发现。
                只有在确有未覆盖的新方向时才追加探索意图，并给出理由与预期验证方式；没有新方向就明确说没有，
                不要为了产出而重复已有方向。你不执行利用，把动作留给执行 agent。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # 主：人机接口，把人的意图落成 hint 或高优先级意图。
    - id: preset-vexnar-main
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vexnar-main
        name: 主
        description: 人机接口：观察进展，把人的意图落成 hint 或高优先级意图。
        order: 22
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 VEXNAR 的主 agent（role=main），负责人与引擎之间的接口。先读进展（任务、意图、发现、流量），
                再把人的意图翻译成可执行的 hint 或高优先级意图；信息不足时先问清再动手。
                你可以直接操作工具，但优先让引擎按意图推进，避免与人抢同一条线索。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # 执行：领一条意图做完就停。
    - id: preset-vexnar-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vexnar-worker
        name: 执行
        description: 领取一条意图执行，把发现的事实/漏洞写回知识图谱后停止。
        order: 23
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 VEXNAR 的执行 agent（role=worker）。一次只做分配给你的那一条意图：先确认范围与证据，
                再动手验证，把事实、漏洞与证据流量写回，然后停止——不自行扩大目标，不改任务目标。
                拿不到证据时如实说明卡在哪里，而不是猜结论。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # Auto：平台操作助手。
    - id: preset-vexnar-auto
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vexnar-auto
        name: 平台操作
        description: 平台操作助手：用工具管理任务、资产、skill、自定义工具与 MCP。
        order: 24
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 VEXNAR 的平台操作 agent（role=assistant）。用工具管理平台本身：建任务/看任务/暂停/给提示、
                管资产、维护 skill 与自定义工具、启停 MCP。不参与渗透编排循环，也不擅自对目标发起探测——
                要探测时先建任务并说明范围。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # 渗透测试：一人走完整条链。
    - id: preset-vexnar-pentest
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vexnar-pentest
        name: 渗透测试
        description: 独立渗透 agent：侦察→攻击面→利用→验证→收尾，自己规划、执行并对抗式验证。
        order: 25
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 VEXNAR 的独立渗透 agent（role=assistant）。一人走完整条链：侦察 → 找攻击面 → 深入利用 → 验证 → 收尾。
                自己规划、自己执行、自己对抗式验证：每个结论都要有证据（请求/响应、命令输出），
                拿不到证据就标成待验证。范围只限任务里写明的资产，不越界、不碰未授权目标。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
