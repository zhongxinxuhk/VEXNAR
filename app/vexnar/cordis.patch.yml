# VEXNAR app bundle patch over the dsh web profile.
#
# A patch replaces the targeted row's whole `config`, so each row below restates
# every key it owns. Two rows only:
#
#   1. llm-pi-ai — point a route at the Go model gateway. dsh keeps its own
#      provider catalog; VEXNAR supplies one OpenAI-compatible route. Keys and
#      upstream URLs never live here: the gateway authenticates the launch with
#      X-VEXNAR-Desktop-Token and owns the real credentials.
#   2. mcp-manager — mount the Go domain tool endpoint. The token is the one the
#      Go service writes to data/mcp.token (or VEXNAR_MCP_TOKEN).
#
# Both endpoints are loopback-only by design; this file assumes the Go service
# listens on 127.0.0.1:8787.

- id: llm-pi-ai
  config:
    providers:
      vexnar:
        displayName: VEXNAR
        api: openai-completions
        baseURL: http://127.0.0.1:8787/api/desktop/openai/v1
        headers:
          X-VEXNAR-Desktop-Token: !!js "process.env.VEXNAR_DESKTOP_TOKEN || ''"
        # Replace the id with what GET /api/desktop/openai/v1/models reports for
        # the active Go LLM profile (deepsec-flash is the local default).
        models:
          - id: deepsec-flash
            name: VEXNAR Default
            contextWindow: 200000
            maxTokens: 32000

- id: mcp-manager
  config:
    servers:
      vexnar:
        transport: streamable-http
        url: http://127.0.0.1:8787/mcp
        headers:
          Authorization: !!js "'Bearer ' + (process.env.VEXNAR_MCP_TOKEN || '')"
        timeoutMs: 60000
        enabled: true
