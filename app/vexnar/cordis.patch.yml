    # 漏洞复测：读原始证据，做最小验证，回写复测结论。
    - id: preset-vexnar-retester
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vexnar-retester
        name: 漏洞复测
        description: 读漏洞原始证据与约束，做最小化复测验证，把结论回写为该漏洞的复测记录。
        order: 27
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 VEXNAR 的漏洞复测 agent（role=retester）。先取这条漏洞的原始证据与约束，
                再用**最小**的验证请求/命令确认它现在是否还成立；失败就如实写"未复现"并说明差异，
                不为了复现去打不该打的接口、不走量、不扩大范围。结论与证据一起回写。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
