# VEXNAR app bundle patch over the dsh web profile.
#
# Layering rule: this file only targets dsh rows by id. VEXNAR's own code is
# app/vexnar/*, so an upstream update never collides with it.

# ── VEXNAR rows ────────────────────────────────────────────────────────────
- insert:
    - id: vexnar-ui
      name: '@vexnar/dsh-ui'
    - id: vexnar-account
      name: '@vexnar/dsh-account'

# Resolve the first-use workspace inside the VEXNAR data directory.
- id: workspace-controller
  config:
    documentsDirectory: !!js "process.env.VEXNAR_HOME"

# 账号、平台令牌与模型提供方归 @vexnar/dsh-account（TypeScript 侧，见
# account/src/platform-account.ts，构建到 lib/platform-account.js）。它把提供方写进 llm-pi-ai，密钥写进 dsh 凭据库，
# 所以默认模型只是初始值：登录后由插件按真实目录改写。
- id: agent-default-model
  config:
    provider: vexnar
    model: ''
# dsh 原生的模型页保持关闭：提供方只由 VEXNAR 的「设置 → 模型」写入，
# 两个面板写同一个 llm-pi-ai 会变成两份互相覆盖的真相。
- id: ui-settings-models
  disabled: true

# ── Agent egress tools (TS) ────────────────────────────────────────────────
# 代理池/跳板/链式代理/浏览器固定端口/带代理的 shell 执行都在 TS 侧；agent 通过
# 这些工具拿会话出口，不再依赖 Go 的 bash 环境注入。
- insert:
    - id: vexnar-egress
      name: '@vexnar/dsh-egress'
      # 旧 profile 的依赖清单可能没有这个可选插件。
      disabled: !!js >-
        (() => {
          const profile = ctx.get('profileContext')
          if (!profile) return true
          const { existsSync } = process.getBuiltinModule('node:fs')
          const { join } = process.getBuiltinModule('node:path')
          return !existsSync(join(profile.dir, 'node_modules', '@vexnar', 'dsh-egress', 'index.js'))
        })()
      config:
        coreUrl: http://127.0.0.1:8790
        tokenEnv: VEXNAR_API_TOKEN
        taskIdEnv: VEXNAR_TASK_ID

# ── Domain tools (TS, in-process) ─────────────────────────────────────────
# P1-1 只装注入面与 registerTool 骨架；P1-2 起流量/finding/复测/web 工具在这里
# 注册，全部走同进程的 vexnarCore，不再新增端口。旧 profile 没装该包时跳过。
- insert:
    - id: vexnar-tools
      name: '@vexnar/dsh-tools'
      disabled: !!js >-
        (() => {
          const profile = ctx.get('profileContext')
          if (!profile) return true
          const { existsSync } = process.getBuiltinModule('node:fs')
          const { join } = process.getBuiltinModule('node:path')
          return !existsSync(join(profile.dir, 'node_modules', '@vexnar', 'dsh-tools', 'index.js'))
        })()

# ── Domain tools ──────────────────────────────────────────────────────────
# `vexnar-web` 是常驻的：会话感知 HTTP 引擎由 core 在启动时拉起（127.0.0.1:8792），
# 令牌与 core 同源（VEXNAR_WEB_MCP_TOKEN 优先，其次启动器注入的桌面令牌）。
# 旧的整段 Go 工具面（vexnar）只在 go 回退模式挂载，默认不参与组装。
- id: mcp-manager
  config:
    servers: !!js >-
      (() => {
        const token = process.env.VEXNAR_WEB_MCP_TOKEN || process.env.VEXNAR_DESKTOP_TOKEN || ''
        const servers = {
          'vexnar-web': {
            transport: 'streamable-http',
            url: 'http://127.0.0.1:' + (process.env.VEXNAR_WEB_MCP_PORT || '8792') + '/mcp',
            headers: token ? { Authorization: 'Bearer ' + token } : {},
            timeoutMs: 60000
          }
        }
        if (process.env.VEXNAR_RUNTIME_MODE === 'go') {
          servers.vexnar = {
            transport: 'streamable-http',
            url: 'http://127.0.0.1:8787/mcp',
            headers: { Authorization: 'Bearer ' + (process.env.VEXNAR_MCP_TOKEN || '') },
            timeoutMs: 60000
          }
        }
        return servers
      })()

# ── Brand: VEXNAR replaces the official artwork ─────────────────────────────
# @vexnar/dsh-ui occupies sidebar.brand.mark / sidebar.brand.name, so the
# official occupant must be off: two occupants of a single slot throw at load.
- id: ui-brand-official
  disabled: true

# ── Account: VEXNAR owns sign-in ────────────────────────────────────────────
# DeepSeek is available as a key-only manufacturer preset under Settings → Models.
- id: deepseek-account
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: ui-settings-account
  disabled: true
- id: ui-account-notifications
  disabled: true
- id: llm-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: ui-settings-web-search
  disabled: true

# ── Skin defaults: Claude Style, baked in ──────────────────────────────────
# 皮肤设置页把用户改过的每个值写进 profile 的 patch 层；新机器没有那一层，
# 皮肤于是回到上游默认（字体、动效、侧栏都变一遍）。这里把选定的整套写进
# bundle patch：profile patch 仍然最后应用，所以用户自己改过的值优先。
- id: ui-skin-claude-style
  name: dsh-claude-style
  config:
    # 品牌：标记图由 @vexnar/dsh-account 注入（把皮肤的 DeepSeek 鲸鱼换成 VEXNAR logo），
    # 这里只定名字与整体配色方案。
    brand: deepseek
    brandName: VEXNAR
    statusMotion: wash
    sodium: on
    homeLayout: classic
    homeRipple: true
    searchStyle: icon
    ongoingIndicator: ring
    reasoningDisplay: stepped
    sidebarLayout: compact

# 会话日志与对话视图的默认值同样是"用户设过、新机器却没有"的那一类。
- id: session-log-deepseek
  name: '@deepseek-ai/dsh-session-log-deepseek'
  config:
    enabled: false
- id: ui-chat
  name: '@deepseek-ai/dsh-client-ui-chat'
  config:
    collapseTiming: next-input
    foldedReplies: final
    transcriptView: compact

# ── Agent presets: the engine's roles, registered as built-in dsh agents ────
# The engine seeds eight named roles (goals / planner / main / worker / auto /
# pentest / reporter / retester). They are copied here as ordinary
# @deepseek-ai/dsh-agent-preset rows, so the roster, the names, the
# descriptions and every capability composition live in dsh's own 设置 →
# Agent 预设. VEXNAR ships no agent settings section of its own: a second panel
# listing the same rows made two truths out of one roster and left the
# question "which one is actually in effect" unanswerable.
#
# Renaming or disabling a role is therefore a patch/bundle edit (dsh 创造模式),
# not a PATCH request. Per-run agents the engine spawns on demand
# (lock_agent_<id> / write_lock_agent_<id>) are run artifacts, not roster
# entries, and deliberately do not appear here.
- insert:
    # 目标拆解：只读地把目标拆成可验证子目标。
    - id: preset-vexnar-goals
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vexnar-goals
        name: 目标拆解
        description: 把渗透任务目标拆解成若干独立、可验证的子目标。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 VEXNAR 的目标拆解 agent（role=goals）。把任务目标读清楚，拆成彼此独立、可验证的子目标：
                每个子目标写清验证方式（看到什么算达成）和依赖关系，不臆造目标里没有的范围。
                只做拆解与核对，不执行利用、不改资产、不登记漏洞。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # 规划：读态势、补方向，不直接执行。
    - id: preset-vexnar-planner
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vexnar-planner
        name: 规划
        description: 读取态势、判定目标，只在确有未覆盖的新方向时补充探索意图。
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 VEXNAR 的规划 agent（role=planner）。先读态势：任务目标、已覆盖的目标、资产与已确认发现。
                只有在确有未覆盖的新方向时才追加探索意图，并给出理由与预期验证方式；没有新方向就明确说没有，
                不要为了产出而重复已有方向。你不执行利用，把动作留给执行 agent。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # 主：人机接口，把人的意图落成 hint 或高优先级意图。
    - id: preset-vexnar-main
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vexnar-main
        name: 主
        description: 人机接口：观察进展，把人的意图落成 hint 或高优先级意图。
        order: 22
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 VEXNAR 的主 agent（role=main），负责人与引擎之间的接口。先读进展（任务、意图、发现、流量），
                再把人的意图翻译成可执行的 hint 或高优先级意图；信息不足时先问清再动手。
                你可以直接操作工具，但优先让引擎按意图推进，避免与人抢同一条线索。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # 执行：领一条意图做完就停。
    - id: preset-vexnar-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vexnar-worker
        name: 执行
        description: 领取一条意图执行，把发现的事实/漏洞写回知识图谱后停止。
        order: 23
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 VEXNAR 的执行 agent（role=worker）。一次只做分配给你的那一条意图：先确认范围与证据，
                再动手验证，把事实、漏洞与证据流量写回，然后停止——不自行扩大目标，不改任务目标。
                拿不到证据时如实说明卡在哪里，而不是猜结论。
                需要出网时用 egress_exec 跑命令（自动带本任务会话代理）；单节点被 WAF/拦截页挡住时用
                fanout_fetch 并发取证；拿到 SSH -D / C2 socks 等跳板立即 pivot_add（可用 via_node_id 链式），
                然后按“证据→跳板→下一层”记录层级，不越出任务范围。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # Auto：平台操作助手。
    - id: preset-vexnar-auto
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vexnar-auto
        name: 平台操作
        description: 平台操作助手：用工具管理任务、资产、skill、自定义工具与 MCP。
        order: 24
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 VEXNAR 的平台操作 agent（role=assistant）。用工具管理平台本身：建任务/看任务/暂停/给提示、
                管资产、维护 skill 与自定义工具、启停 MCP。不参与渗透编排循环，也不擅自对目标发起探测——
                要探测时先建任务并说明范围。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # 渗透测试：一人走完整条链。
    - id: preset-vexnar-pentest
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vexnar-pentest
        name: 渗透测试
        description: 独立渗透 agent：侦察→攻击面→利用→验证→收尾，自己规划、执行并对抗式验证。
        order: 25
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 VEXNAR 的独立渗透 agent（role=assistant）。一人走完整条链：侦察 → 找攻击面 → 深入利用 → 验证 → 收尾。
                自己规划、自己执行、自己对抗式验证：每个结论都要有证据（请求/响应、命令输出），
                拿不到证据就标成待验证。范围只限任务里写明的资产，不越界、不碰未授权目标。
                出网统一走 egress_exec（会话代理）；被单节点拦截时用 fanout_fetch 对抗取证；
                取得跳板后用 pivot_add 登记，可用 via_node_id 把跳板串在已有节点后面做链式代理，
                再逐层验证下一跳/内网目标；每一层的证据、跳板 node_id 与依赖关系都要写回，便于复现整条利用链。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # 报告撰写：漏洞被登记即触发，读证据、写 Markdown 报告并回写。
    - id: preset-vexnar-reporter
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vexnar-reporter
        name: 报告撰写
        description: 漏洞详细报告撰写：发现漏洞时触发，读证据与执行过程后写报告并回写。
        order: 26
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 VEXNAR 的报告撰写 agent（role=reporter）。触发时先读这条漏洞的证据清单与执行过程，
                再写 Markdown 报告并回写：影响与危害、复现步骤、证据/PoC、修复建议，一段不缺。
                只写证据支持得住的内容：证据为空就照实写"无流量证据"，不补想象出来的请求响应，
                也不为了报告好看去发起新的攻击请求。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
              applyPatch: false
