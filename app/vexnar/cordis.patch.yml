# VEXNAR app bundle patch over the dsh web profile.
#
# Layering rule: this file only targets dsh rows by id. VEXNAR's own code is
# app/vexnar/*, so an upstream update never collides with it.

# ── VEXNAR rows ────────────────────────────────────────────────────────────
- insert:
    - id: vexnar-ui
      name: '@vexnar/dsh-ui'
    - id: vexnar-account
      name: '@vexnar/dsh-account'

# ── Model access: TypeScript → NewAPI directly ─────────────────────────────
# The provider route is written at login by @vexnar/dsh-account into the
# llm-pi-ai settings namespace (baseURL + apiKeyEnv + model catalog). Nothing
# here points at the Go gateway; the key lives in dsh's credential store.

# ── Domain tools (transitional) ────────────────────────────────────────────
# Task/finding/traffic tools still live in the Go service while the TS
# migration lands. Remove this row once those tools exist in TypeScript.
- id: mcp-manager
  config:
    servers:
      vexnar:
        transport: streamable-http
        url: http://127.0.0.1:8787/mcp
        headers:
          Authorization: !!js "'Bearer ' + (process.env.VEXNAR_MCP_TOKEN || '')"
        timeoutMs: 60000
      # Craft Anything: bundled CLI (essentials toolset by default, not all 320
      # tools). app/scripts/craft-update.mjs keeps the binary current.
      craft:
        transport: stdio
        command: !!js "process.env.CRAFT_ANYTHING_CLI || (process.env.HOME + '/.dsh/plugins-data/craft-anything/craft-anything-cli')"
        args:
          - mcp
        timeoutMs: 120000

# ── Brand: VEXNAR replaces the official artwork ─────────────────────────────
# @vexnar/dsh-ui occupies sidebar.brand.mark / sidebar.brand.name, so the
# official occupant must be off: two occupants of a single slot throw at load.
- id: ui-brand-official
  disabled: true

# ── Account: VEXNAR owns sign-in ────────────────────────────────────────────
# Upstream DeepSeek account rows stay disabled; VEXNAR signs in to NewAPI and
# routes model traffic itself.
- id: deepseek-account
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: ui-settings-account
  disabled: true
- id: ui-account-notifications
  disabled: true
