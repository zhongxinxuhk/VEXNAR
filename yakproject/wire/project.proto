// Project metadata subset of yaklang/yaklang common/yakgrpc/yakgrpc.proto
// (AGPL-3.0, 1.4.9-beta8). Keep upstream service paths and wire field numbers.
syntax = "proto3";
package ypb;
option go_package = "github.com/zhongxinxuhk/vexnar/yakproject/wire";

message Paging {
  int64 page = 51;
  int64 limit = 52;
}
message GetProjectsRequest {
  string project_name = 1;
  Paging pagination = 3;
  string type = 6;
  string frontend_type = 7;
  string external_module = 9;
  string external_project_code = 10;
}
message GetProjectsResponse {
  repeated ProjectDescription projects = 1;
}
message ProjectDescription {
  string project_name = 1;
  int64 id = 3;
  string external_module = 13;
  string external_project_code = 14;
}
message NewProjectRequest {
  string project_name = 1;
  string description = 2;
  string type = 5;
  string external_module = 8;
  string external_project_code = 9;
}
message NewProjectResponse {
  int64 id = 1;
  string project_name = 2;
}
