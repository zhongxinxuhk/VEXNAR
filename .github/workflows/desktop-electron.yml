name: desktop-electron

# Builds the independent Electron desktop client and the portable PostgreSQL
# that ships inside it. PostgreSQL is built/downloaded per platform first, then
# the installer job consumes the matching artifact. Nothing in this workflow
# falls back to SQLite.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

env:
  PG_VERSION: "16.16"
  NODE_VERSION: "24"

jobs:
  pg:
    name: pg-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: pg-darwin-arm64
            command: bash apps/desktop/scripts/ci/build-pg-macos.sh
          - os: ubuntu-22.04
            name: pg-linux-x64
            command: bash apps/desktop/scripts/ci/build-pg-linux.sh
          - os: windows-2022
            name: pg-windows-x64
            command: pwsh -NoProfile -File apps/desktop/scripts/ci/fetch-pg-windows.ps1
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex

      - name: Build portable PostgreSQL
        shell: bash
        run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: apps/desktop/dist/${{ matrix.name }}*
          retention-days: 14

  package:
    name: package-${{ matrix.platform }}-${{ matrix.arch }}
    needs: pg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
            pg: pg-darwin-arm64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            pg: pg-linux-x64
          - os: windows-2022
            platform: win
            arch: x64
            pg: pg-windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.pg }}
          path: apps/desktop/pg-artifact

      - name: Install portable PostgreSQL into resources
        if: runner.os != 'Windows'
        run: |
          mkdir -p apps/desktop/resources
          tar -xzf apps/desktop/pg-artifact/*.tar.gz -C apps/desktop/resources
          test -x apps/desktop/resources/pg/bin/initdb

      - name: Install portable PostgreSQL into resources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/resources | Out-Null
          $zip = Get-ChildItem apps/desktop/pg-artifact/*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath apps/desktop/resources -Force
          if (-not (Test-Path apps/desktop/resources/pg/bin/initdb.exe)) {
            throw "portable PostgreSQL is missing initdb.exe"
          }

      - name: Install Node dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build renderer/main
        working-directory: apps/desktop
        run: npm run build

      - name: Package macOS
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        run: npx electron-builder --mac --arm64 --publish never

      - name: Package Linux
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: npx electron-builder --linux --x64 --publish never

      - name: Package Windows
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: vexnar-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.exe
          retention-days: 14
