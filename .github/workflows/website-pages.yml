name: Official website · GitHub Pages
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website-pages.yml']
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: website-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install React build dependencies
        working-directory: website
        run: npm ci
      - name: Prepare public GitHub metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 website/scripts/prepare_data.py
      - name: Build and pre-render React pages
        working-directory: website
        run: npm run build
      - name: Verify Pages routes and assets
        working-directory: website
        run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
