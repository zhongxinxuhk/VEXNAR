name: App build

on:
  pull_request:
    paths:
      - 'app/**'
      - 'assets/logo.png'
      - '.github/workflows/app-build.yml'
  push:
    branches: [main]
    tags: ['app-v*']
    paths:
      - 'app/**'
      - 'assets/logo.png'
      - '.github/workflows/app-build.yml'
  workflow_dispatch:
    inputs:
      desktop:
        description: Build unsigned dsh desktop installers
        type: boolean
        default: true
      publish:
        description: Publish the installers as a release (version bumps automatically)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  app-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check no runtime data is tracked
        # store（任务 / 漏洞 / 流量 / 会话）、日志、归档一旦进了索引，就会随
        # clone 一起发出去；预设 Agent 与拦截规则是代码，不受这条限制。
        # 零依赖的 .mjs，故意放在安装依赖之前，失败时不用等整条构建。
        run: node app/scripts/check-tracked-data.mjs
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Build VEXNAR plugins
        working-directory: app
        # app/ 只有 pnpm 一个包管理入口（app/pnpm-lock.yaml），所有插件都在同一个
        # workspace 里；只装这几个包的闭包，避免把 electron 之类与本任务无关的重依赖拉下来。
        # 六个包缺一不可：core 的 build:embedded 产出落进 account/lib，egress 是常驻插件，
        # tools 由 cordis.patch.yml 挂载，mcp 是 Go 模式下的工具面，漏掉任何一个都会让
        # 构建失败或安装包少一截功能（漏掉 tools 或 mcp 时 build.ts 找不到 esbuild）。
        # 产物不入库，所以这里必须是全量重建。
        run: |
          pnpm install --frozen-lockfile \
            --filter @vexnar/dsh-ui... \
            --filter @vexnar/dsh-account... \
            --filter @vexnar/dsh-egress... \
            --filter @vexnar/dsh-tools... \
            --filter @vexnar/dsh-vexnar-mcp... \
            --filter @vexnar/core...
          pnpm run clean:outputs
          pnpm run build
          node scripts/check-built-artifacts.mjs
      - name: Archive plugins and profile
        working-directory: app
        run: |
          cp ../assets/logo.png vexnar/account/assets/logo.png
          # 目录整体归档。点名文件才会漏：上一版只写了 account/lib 的 index/client 两个，
          # 同一个目录里另外十三个宿主模块和 core-embedded 都没进包。
          # client.cjs 是可复现的中间产物，node_modules 与运行时无关，一并排除。
          tar -czf "$RUNNER_TEMP/vexnar-app-bundle.tar.gz" \
            --exclude='node_modules' --exclude='*.cjs' \
            upstream.lock.json \
            vexnar/package.json vexnar/cordis.patch.yml vexnar/extras.json vexnar/src \
            vexnar/ui/package.json vexnar/ui/lib \
            vexnar/account/package.json vexnar/account/lib vexnar/account/assets \
            vexnar-egress \
            vexnar-tools \
            vexnar-mcp \
            -C .. LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: vexnar-app-bundle
          path: ${{ runner.temp }}/vexnar-app-bundle.tar.gz
          if-no-files-found: error
      - name: Prepare desktop overlay
        working-directory: app
        # 安装包要「装完就能用」：把 extras.json 里的插件全部装进一份 profile，
        # 连同 VEXNAR 插件一起作为覆盖层随包发出去。用户首启不再联网重装一遍
        # ——这正是上一版 dmg 装上去只有上游界面的原因。
        run: |
          pnpm run overlay:prepare
          node -e "const p = require('./scripts/vexnar-packages.json'); const m = require('./.desktop-overlay/overlay.json'); \
            const want = p.shipped.map(x => x.name); const got = m.fileDeps.map(x => x.name); \
            const missing = want.filter(n => !got.includes(n)); \
            if (missing.length) throw new Error('overlay 缺少本地依赖：' + missing.join(', ')); \
            const lost = p.shipped.filter(x => x.bundle).map(x => x.name).filter(n => !m.bundles.includes(n)); \
            if (lost.length) throw new Error('overlay 的 bundles 层缺少：' + lost.join(', ')); \
            console.log('overlay OK：' + m.bundles.length + ' 个 bundle，' + m.fileDeps.length + ' 个本地依赖')"
          tar -czf "$RUNNER_TEMP/vexnar-desktop-overlay.tar.gz" -C . .desktop-overlay
      - uses: actions/upload-artifact@v4
        with:
          name: vexnar-desktop-overlay
          path: ${{ runner.temp }}/vexnar-desktop-overlay.tar.gz
          if-no-files-found: error

  desktop:
    if: startsWith(github.ref, 'refs/tags/app-v') || (github.event_name == 'workflow_dispatch' && inputs.desktop)
    needs: app-bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: mac-arm64, script: 'package:desktop:mac:arm64:unsigned', ext: dmg }
          - { runner: windows-2022, target: win-x64, script: 'package:desktop:win:x64:unsigned', ext: exe }
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本号要从本地标签推：浅克隆看不到 tag，会把发行版号算成 0.0.1。
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned dsh source
        shell: bash
        run: bash app/scripts/fetch-dsh.sh
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: app/dsh/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: app/dsh/pnpm-lock.yaml
      - name: Verify dsh checkout matches the App bundle lock
        working-directory: app/dsh
        run: >-
          node -e "const {execFileSync} = require('node:child_process');
          const head = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          if (head !== require('../upstream.lock.json').commit) throw new Error('dsh checkout differs from app/upstream.lock.json');"
      - uses: actions/download-artifact@v4
        with:
          name: vexnar-desktop-overlay
          # 相对 workspace 落地，不用 $RUNNER_TEMP：Windows runner 上它是
          # `D:\a\_temp`，拼进 Git Bash 的 tar 参数后整段被当成转义吃掉，
          # 报「Failed to open '/overlay/…'」。
          path: overlay
      - name: Unpack the VEXNAR overlay
        shell: bash
        # 覆盖层必须到位再打补丁：brand 会把它的绝对路径写进 electron-builder 的
        # extraResources，缺了它打出来的就是上游空壳。
        #
        # 解到短目录而不是工作区内：profile 的 node_modules 里最长的一条相对路径
        # 有 232 字符，落在 `D:\a\VEXNAR\VEXNAR\app\` 下会越过 Windows 的 260
        # 字符上限。`VEXNAR_OVERLAY` 把这个位置告诉 brand。
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then target='C:/ov'; else target="$RUNNER_TEMP/ov"; fi
          rm -rf "$target" && mkdir -p "$target"
          tar -xzf overlay/vexnar-desktop-overlay.tar.gz -C "$target"
          test -f "$target/.desktop-overlay/overlay.json"
          echo "VEXNAR_OVERLAY=$target/.desktop-overlay" >> "$GITHUB_ENV"
          node -e "const {readdirSync} = require('node:fs'); console.log('overlay:', readdirSync(process.argv[1]).join(', '))" "$target/.desktop-overlay"
      - name: Resolve the release version
        id: release
        # 安装包里的「关于与更新」显示发行版号（0.0.12），不是上游的构建号
        # （0.2.2-rc.5）。publish 作业随后用同一份算法算 tag，两边必须一致。
        run: node app/scripts/release.mjs version
      - name: Apply the VEXNAR brand patch
        working-directory: app
        shell: bash
        env:
          VEXNAR_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        # 安装包是拿 vendored 的上游打的，用户看到的必须是 VEXNAR Harness：
        # productName / 产物前缀 / .app 目录名 / 桌面文案 / 图标 / CLI 命令 / home 目录。
        # 改了哪些文件记在 app/.vexnar-brand.json，upstream:check 据此放宽到「只差品牌补丁」。
        #
        # 直接跑脚本，不经 `pnpm run`：pnpm 12 会在执行脚本前按 verify-deps-before-run
        # 先装一遍 app/ 依赖，brand 只用 node 内置模块，不需要它；上一轮两个平台也恰好
        # 是在这次隐式安装之后丢了 app/dsh（构建在这一步失败）。万一还是不在，就地重拉。
        run: |
          if [ ! -f dsh/package.json ]; then
            echo "::warning::app/dsh 缺失，重新执行 fetch-dsh.sh"
            bash scripts/fetch-dsh.sh
          fi
          node scripts/brand-desktop.mjs
      - name: Install dsh workspace dependencies
        working-directory: app/dsh
        run: pnpm install --frozen-lockfile
      - name: Write unsigned packaging preset
        shell: bash
        # Windows 的 --unsigned 分支照样要读一份打包配置（macOS 的 --unsigned 用内置
        # 本地默认，不读文件），而上游把 .env.windows 放在 git-ignored 的 vendored 树里。
        # 用它自己的 CI 入口：DSH_PACKAGING_PRESET + DSH_PACKAGING_CONFIG_DIR，配置写在
        # runner 临时目录，仓库和 app/dsh 都不留第二个 .env。
        # 两个 origin 用 RFC 2606 的 .invalid：unsigned 产物不做更新/登录检查，
        # 填一个真域名反而会让人以为它会联网。
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-packaging/presets"
          cat > "$RUNNER_TEMP/dsh-packaging/presets/test.env" <<'EOF'
          DSH_DESKTOP_APP_ID=com.vexnar.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://updates.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://login.invalid"]}'
          EOF
      - name: Build unsigned desktop installer
        working-directory: app/dsh
        env:
          DSH_PACKAGING_PRESET: test
          DSH_PACKAGING_CONFIG_DIR: ${{ runner.temp }}/dsh-packaging
        run: pnpm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-${{ matrix.target }}-unsigned
          path: app/dsh/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    # 打包成功就发版：版本号从 v0.0.1 起按补丁位自动延续，发行说明由提交历史生成。
    # 手工 dispatch 时可以用 publish=false 只打包不发布；tag 触发时版本取该 tag。
    if: needs.desktop.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    needs: [app-bundle, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 发版后要触发站点重建：Release 由 GITHUB_TOKEN 创建，GitHub 不会拿它去触发
      # `release: published`，下载页只能靠这一步显式 dispatch（或等 6 小时的 cron）。
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本号与发行说明都从本地标签和提交历史推出来，浅克隆看不到。
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve next version
        id: version
        run: node app/scripts/release.mjs version
      - name: Generate release notes
        run: >-
          node app/scripts/release.mjs notes
          --version "${{ steps.version.outputs.version }}"
          --previous "${{ steps.version.outputs.previous }}"
          --out "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          # 只取两个安装包（dsh-<target>-unsigned）。覆盖层有一千多兆，属于构建
          # 中间物，不进 Release；`merge-multiple` 全部下载会把下面的 *.tar.gz
          # 数量断言顶掉。
          pattern: dsh-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: vexnar-app-bundle
          path: release-assets
          merge-multiple: true
      - name: Name assets after the release
        working-directory: release-assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # 两个安装包：macOS arm64 的 dmg 与 Windows x64 的 exe（macOS x64 不打包）。
          test "$(ls *.dmg | wc -l)" -eq 1
          test "$(ls *.exe | wc -l)" -eq 1
          test "$(ls *.tar.gz | wc -l)" -eq 1
          mv "$(ls *.dmg)" "VEXNAR-${VERSION}-mac-arm64.dmg"
          mv "$(ls *.exe)" "VEXNAR-${VERSION}-win-x64.exe"
          mv "$(ls *.tar.gz)" "vexnar-app-bundle-${VERSION}.tar.gz"
          sha256sum ./*.dmg ./*.exe ./*.tar.gz > SHA256SUMS
      - name: Publish release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # 重跑同一次构建会命中同一个 tag（release.mjs 会复用 HEAD 上的标签），
          # 这时改成覆盖附件与说明，版本号不会被顶上去。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "VEXNAR Harness v${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              ./*.dmg ./*.exe ./*.tar.gz ./SHA256SUMS
          fi
      - name: Refresh the download page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run website-pages.yml --ref main
