<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VEXNAR</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080b10;
        --panel: #0f141b;
        --border: #1e2732;
        --text: #e8eef6;
        --muted: #7d8b9c;
        --accent: #4ea1ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60rem 30rem at 50% -10%, rgba(78, 161, 255, 0.14), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
        user-select: none;
      }
      .card {
        width: min(26rem, calc(100vw - 4rem));
        padding: 2.5rem 2.25rem;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: var(--panel);
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      img {
        width: 84px;
        height: 84px;
        object-fit: contain;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 0 1.25rem;
        font-size: 1.35rem;
        letter-spacing: 0.18em;
        font-weight: 600;
      }
      p {
        margin: 0.35rem 0;
        font-size: 0.9rem;
        color: var(--muted);
      }
      #status {
        color: var(--text);
        font-size: 0.95rem;
      }
      .spinner {
        width: 1.25rem;
        height: 1.25rem;
        margin: 1.4rem auto 0;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      pre {
        margin-top: 1.25rem;
        padding: 0.85rem;
        border: 1px solid var(--border);
        border-radius: 0.6rem;
        background: #0a0e13;
        color: #ffb4a8;
        font-size: 0.75rem;
        line-height: 1.5;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 12rem;
        overflow: auto;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="logo.png" alt="VEXNAR" />
      <h1>VEXNAR</h1>
      <p id="status">正在启动本地服务…</p>
      <p id="detail">首次启动会初始化数据目录，请稍候。</p>
      <div class="spinner" id="spinner"></div>
      <pre id="error" hidden></pre>
    </main>
    <script>
      window.__vexnarError = function (message) {
        var spinner = document.getElementById("spinner");
        if (spinner) spinner.remove();
        document.getElementById("status").textContent = "启动失败";
        document.getElementById("detail").textContent = "请检查日志后重新启动。";
        var el = document.getElementById("error");
        el.hidden = false;
        el.textContent = message;
      };
    </script>
  </body>
</html>
